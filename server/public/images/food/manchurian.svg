<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" style="background:#09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="culinaryGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#7f1d1d" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Ambient Culinary Lighting -->
  <ellipse cx="400" cy="220" rx="360" ry="200" fill="url(#culinaryGlow)" />

  <!-- Background Decorative Grid/Accents -->
  <circle cx="400" cy="220" r="190" fill="none" stroke="#fed7aa" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 8" />
  <circle cx="400" cy="220" r="230" fill="none" stroke="#b91c1c" stroke-opacity="0.05" stroke-width="1" />

  <!-- Central Serving Platter / Tawa / Dish Base -->
  <g filter="url(#shadow)">
    <!-- Base rim -->
    <circle cx="400" cy="220" r="150" fill="url(#plateGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <circle cx="400" cy="220" r="135" fill="#18181b" stroke="#fed7aa" stroke-opacity="0.25" stroke-width="1.5" />
    <!-- Inner dish bed -->
    <circle cx="400" cy="220" r="120" fill="rgba(0,0,0,0.4)" />
  </g>

  <!-- Custom Dish Graphic Elements -->
  

  <!-- Dish Primary Iconic Focus -->
  <g transform="translate(400, 215)" filter="url(#glow)">
    <text text-anchor="middle" dominant-baseline="central" font-size="88" style="filter: drop-shadow(0 10px 18px rgba(0,0,0,0.5));">🧆</text>
  </g>

  <!-- Steam / Aroma Swirls -->
  <path d="M370,130 Q360,105 375,85 T365,55" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" />
  <path d="M400,120 Q415,95 405,75 T415,45" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M430,135 Q445,110 435,90 T445,60" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" />

  <!-- Top Campus Fresh Badge -->
  <g transform="translate(35, 35)">
    <rect width="180" height="34" rx="17" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#22c55e" />
    <text x="34" y="22" fill="#e4e4e7" font-size="12" font-weight="700" letter-spacing="1">MITHIBAI EATS</text>
  </g>

  <!-- Category & Dietary Tag Pill -->
  <g transform="translate(585, 35)">
    <rect width="180" height="34" rx="17" fill="#16a34a" opacity="0.95" />
    <text x="90" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="1">INDO-CHINESE</text>
  </g>

  <!-- Bottom Glassmorphism Dish Information Banner -->
  <g transform="translate(40, 380)">
    <rect width="720" height="85" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" backdrop-filter="blur(16px)" />
    
    <!-- Food Title & Subtitle -->
    <text x="30" y="38" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="0.5">Crispy Veg Manchurian</text>
    <text x="30" y="64" fill="#fed7aa" font-size="14" font-weight="600" letter-spacing="0.2">Golden Veg Fritters • Glossy Garlic Soya Glaze • Fresh Coriander</text>
    
    <!-- Fresh Indicator on right -->
    <g transform="translate(570, 25)">
      <rect width="120" height="36" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
      <text x="60" y="23" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="700">★ 4.8 FRESH</text>
    </g>
  </g>
</svg>